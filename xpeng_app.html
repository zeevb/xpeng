
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בדיקת מסירה Xpeng</title>
    <style>
        :root {
            --primary: #1F4E79;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --ok-color: #28a745;
            --fail-color: #dc3545;
            --note-color: #ffc107;
            --text-main: #333;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #f5f9fb;
            color: var(--primary);
            padding: 22px 15px;
            text-align: center;
            border-bottom: 1px solid #dce7ef;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .home-link {
            order: 2;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
        }
        .home-link:hover, .home-link:focus-visible {
            text-decoration: underline;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            order: 1;
            text-align: right;
        }
        .progress-container {
            padding: 10px 15px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-text {
            font-weight: bold;
        }
        .reset-btn, .summary-btn {
            background: none;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .list-btn {
            background: none;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .category {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .task {
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .status-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        .btn.active-ok { background-color: var(--ok-color); color: white; border-color: var(--ok-color); }
        .btn.active-fail { background-color: var(--fail-color); color: white; border-color: var(--fail-color); }
        .btn.active-note { background-color: var(--note-color); color: #333; border-color: var(--note-color); }
        .comment-input {
            grid-column: 1 / -1;
            width: 100%;
            min-height: 72px;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font: inherit;
            resize: vertical;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .nav-btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 45%;
        }
        .nav-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #summary-screen {
            display: none;
            padding: 20px;
            background: white;
            flex: 1;
            overflow-y: auto;
        }
        .summary-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 1.1rem;
        }
        .summary-stat span:last-child { font-weight: bold; }
        #list-screen {
            display: none;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }
        .list-actions {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }
        .export-btn {
            background: var(--primary);
            border: 1px solid var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
        }
        .list-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            text-align: right;
            cursor: pointer;
            font: inherit;
        }
        .list-item:hover, .list-item:focus { border-color: var(--primary); }
        .list-number { min-width: 2em; color: #666; font-weight: bold; }
        .list-content { flex: 1; }
        .list-category { display: block; color: #666; font-size: 0.8rem; margin-bottom: 3px; }
        .list-task { line-height: 1.35; }
        .list-comment { color: #666; font-size: 0.85rem; margin-top: 5px; }
        .list-status { min-width: 5.5em; text-align: center; font-size: 0.8rem; font-weight: bold; }
        .status-ok { color: var(--ok-color); }
        .status-note { color: #b58100; }
        .status-fail { color: var(--fail-color); }
        .status-empty { color: #777; }
    </style>
</head>
<body>

    <header>
        <div class="topbar">
            <a class="home-link" href="index.html">חזרה לכלים</a>
            <h1>בדיקת מסירה XPENG</h1>
        </div>
    </header>

    <div class="progress-container" id="checklist-header">
        <span class="progress-text" id="progress-text">פריט <span id="current-idx">1</span> מתוך <span id="total-idx">48</span></span>
        <div id="header-actions">
            <button class="list-btn" onclick="showList()">רשימה</button>
            <button class="summary-btn" onclick="toggleSummary()">סיכום</button>
            <button class="reset-btn" onclick="resetProgress()">איפוס</button>
        </div>
    </div>

    <main id="checklist-screen">
        <div class="card">
            <div class="category" id="item-category">קטגוריה</div>
            <div class="task" id="item-task">תיאור הבדיקה...</div>

            <div class="status-buttons">
                <button class="btn" id="btn-ok" onclick="setStatus('ok')">תקין</button>
                <button class="btn" id="btn-fail" onclick="setStatus('fail')">לא תקין</button>
                <textarea class="comment-input" id="comment-input" placeholder="הערה / תגובה"></textarea>
            </div>
        </div>
    </main>

    <div id="list-screen" aria-label="רשימת פריטי הבדיקה"></div>

    <div id="summary-screen">
        <h2 style="text-align: center;">סיכום בדיקה</h2>
        <div class="summary-stat"><span>סך הכל פריטים:</span> <span id="sum-total">0</span></div>
        <div class="summary-stat"><span>תקין:</span> <span id="sum-ok" style="color: var(--ok-color);">0</span></div>
        <div class="summary-stat"><span>הערות:</span> <span id="sum-comments" style="color: #d39e00;">0</span></div>
        <div class="summary-stat"><span>לא תקין:</span> <span id="sum-fail" style="color: var(--fail-color);">0</span></div>
        <div class="summary-stat"><span>לא נבדק:</span> <span id="sum-empty">0</span></div>
        <button class="nav-btn" style="width: 100%; margin-top: 20px;" onclick="toggleSummary()">חזור לבדיקה</button>
    </div>

    <div class="navigation" id="checklist-footer">
        <button class="nav-btn" id="btn-prev" onclick="prevItem()">הקודם</button>
        <button class="nav-btn" id="btn-next" onclick="nextItem()">הבא</button>
    </div>

    <script>
        const checklist = [{"id":"check-001","category":"מרכב הרכב","task":"אזור חיבור הדלתות ומסגרת לבדוק שאין עיקומים"},{"id":"check-002","category":"מרכב הרכב","task":"בדיקת גג פנורמי שאין סדקים או שריטות מלמעלה ומלמטה"},{"id":"check-003","category":"מרכב הרכב","task":"מבט מתחת לרכב ובדיקה שאין מכות / סימני רטיבות / בדגש על תא סוללות"},{"id":"check-004","category":"מרכב הרכב","task":"בדיקת צבע עם מד עובי ופנס (למי שיש את היכולת) בדגש על כנפיים והדלתות"},{"id":"check-005","category":"מרכב הרכב","task":"חיבורי דלתות גומיות וכדומה"},{"id":"check-006","category":"מרכב הרכב","task":"בדיקת צ'יפים (פגיעה בצבע מאבנים) מקדימה על מכסה המנוע בעיקר"},{"id":"check-007","category":"מרכב הרכב","task":"בדיקת נזקים בג'אנטים"},{"id":"check-008","category":"מרכב הרכב","task":"צמיגים - לבדוק שאין ברגים/חתכים"},{"id":"check-009","category":"תוכנה","task":"לבדוק את גרסת הקושחה של הרכב שמעודכן"},{"id":"check-010","category":"תוכנה","task":"עדכון גרסה במקרה הצורך"},{"id":"check-011","category":"תאורה","task":"בדיקת אורות ואיתותים, ברקסים, ערפל גבוה, יום וכו'"},{"id":"check-012","category":"תאורה","task":"בדיקת תאורת אווירה"},{"id":"check-013","category":"תפעול ושליטה","task":"הדלקת מנוע ובדיקת מערכות יחד עם נציג החברה"},{"id":"check-014","category":"תפעול ושליטה","task":"בדיקה כללית למולטימדיה כולל שליטה מההגה"},{"id":"check-015","category":"תפעול ושליטה","task":"בדיקת עוזר קולי open turn on ac וכדומה"},{"id":"check-016","category":"תפעול ושליטה","task":"הפעלת מזגן ל-20 מעלות ובדיקת קירור (לא למהר לכבות)"},{"id":"check-017","category":"תפעול ושליטה","task":"הפעלת חימום ל-35 מעלות ובדיקת חימום (לכבות כשחם)"},{"id":"check-018","category":"תפעול ושליטה","task":"לוודא שכרית נוסע פעילה"},{"id":"check-019","category":"תפעול ושליטה","task":"בדיקת פתחי מיזוג אוויר מקדימה ומאחורה כולל כיוון מכני"},{"id":"check-020","category":"תפעול ושליטה","task":"הפעלת וישרים קדימה אחורה"},{"id":"check-021","category":"תפעול ושליטה","task":"בדיקת טעינה שקע USB קדימה ואחורה (לשים לב שנדרש כבל TYPE-C לבדיקה)"},{"id":"check-022","category":"תפעול ושליטה","task":"קבלת הדרכת תפעול הרכב וכפתורי המסך (מומלץ להקליט לשימוש עתידי)"},{"id":"check-023","category":"תפעול ושליטה","task":"בדיקת טעינה של הרכב עם נציג והדגמה של התחלת טעינה וסיום. ניסוי עצמי!"},{"id":"check-024","category":"אבזור פנימי","task":"כיסא חשמלי נהג + נוסע - בדיקת עבודה תקינה"},{"id":"check-025","category":"אבזור פנימי","task":"חימום וקירור כיסאות קדימה אחורה - בדיקת עבודה תקינה"},{"id":"check-026","category":"אבזור פנימי","task":"בדיקת ריפוד מושבים בתוך הסלון לפגמים או קרעים"},{"id":"check-027","category":"אבזור פנימי","task":"בדיקת ריפוד עליון בסלון לקרעים"},{"id":"check-028","category":"אפליקציה","task":"פתיחת דלתות, תפעול כללי ולראות שהכל נראה תקין ויש אופציה לנהל את הרכב דרך האפליקציה"},{"id":"check-029","category":"אבזור נוסף","task":"שטיחונים"},{"id":"check-030","category":"אבזור נוסף","task":"לבדוק שיש מכסה מנוע קדמי פנימי מפלסטיק מתחת למכסה הברזל"},{"id":"check-031","category":"אבזור נוסף","task":"שלטים תקינים"},{"id":"check-032","category":"אבזור נוסף","task":"כבל טעינה לשקע ציבורי (כבל פינים מלאים)"},{"id":"check-033","category":"אבזור נוסף","task":"לוודא שמקבלים שטיחי חורף (למי שהזמין)"},{"id":"check-034","category":"אבזור נוסף","task":"ערכות תיקון וקומפרסור, ערכת כלים (לא לחפש גלגל ספייר כי אין)"},{"id":"check-035","category":"אבזור נוסף","task":"בדיקת המצאות איתוראן (אם נרכש)"},{"id":"check-036","category":"אבזור נוסף","task":"בדיקת ציפוי NANO (אם נרכש) ע\"י שפיכת מים על כנף - אמור כמעט ולא להישאר מים, רק כמה טיפות"},{"id":"check-037","category":"אבזור נוסף","task":"בדיקת מצלמת DVR (אם נרכשה) ע\"י ניתוק חשמל וסגירה חזקה של הדלת. המצלמה אמורה להקליט"},{"id":"check-038","category":"אבזור נוסף - אופציונלי","task":"וו גרירה חשמלי - בדיקה שנכנס ויוצא ויציב, לנסות טיפה להזיז אותו"},{"id":"check-039","category":"אופציונלי - מומלץ","task":"להגיע לבדיקה עם דיסק און קי בפורמט FAT32 לטובת הקלטה של הדרך והפעלת פונקציית מצלמת דרך הרכב"},{"id":"check-040","category":"אופציונלי - PPF","task":"בדיקה שכל הרכב מצופה כראוי ללא קילופים או פגמים. במקרה של נאנו עם PPF, להוסיף שפיכת מים"},{"id":"check-041","category":"אבזור הגה","task":"לבדוק שחימום ההגה עובד ותקין"},{"id":"check-042","category":"אבזור נוסף","task":"מסאג' בכיסאות - לבדוק שעובד בשני הכיסאות הקדמיים"},{"id":"check-043","category":"פנסים","task":"לבדוק שאין חדירת מים, שריטות, מכות"},{"id":"check-044","category":"רישוי","task":"רישוי - מספר רכב והשלדה תואמים לרישיון (כולל התאמה של הרישיון לצמיגים)"},{"id":"check-045","category":"תא מטען","task":"תא מטען - פתיחה תקינה ושאין עיקומים, לבדוק פתיחה וסגירה חשמלית"},{"id":"check-046","category":"מד קילומטרז'","task":"הרכב הגיע עד 150 קילומטר לכל היותר בהתאם להתחייבות בכתב ההזמנה"},{"id":"check-047","category":"מד סוללה","task":"אזור ה-50 אחוז ומעלה"},{"id":"check-048","category":"אבזור נוסף","task":"מפתח פיזי לפתיחה ללא חשמל, כרטיס NFC"}];
        const legacyChecklist = checklist.filter(item => item.id !== 'check-048');
        const categoryV1Checklist = legacyChecklist.slice();
        const categoryV2Checklist = checklist.slice();
        const categoryOrder = ['מרכב הרכב', 'תוכנה', 'תאורה', 'תפעול ושליטה', 'אבזור פנימי', 'אפליקציה', 'אבזור נוסף'];
        function compareChecklistItems(a, b) {
            const aRank = categoryOrder.indexOf(a.category);
            const bRank = categoryOrder.indexOf(b.category);
            const categoryCompare = (aRank < 0 ? categoryOrder.length : aRank) - (bRank < 0 ? categoryOrder.length : bRank);
            return categoryCompare || a.category.localeCompare(b.category, 'he') || a.task.localeCompare(b.task, 'he');
        }
        checklist.sort(compareChecklistItems);
        categoryV1Checklist.sort(compareChecklistItems);
        categoryV2Checklist.sort(compareChecklistItems);
        let currentIndex = 0;
        let savedStatuses = JSON.parse(localStorage.getItem('xpeng_checklist')) || {};
        let savedComments = JSON.parse(localStorage.getItem('xpeng_checklist_comments')) || {};
        if (localStorage.getItem('xpeng_checklist_order') !== 'id-v1') {
            const migratedStatuses = {};
            const migratedComments = {};
            const previousOrder = localStorage.getItem('xpeng_checklist_order');
            const previousChecklist = previousOrder === 'category-v2'
                ? categoryV2Checklist
                : previousOrder === 'category-v1'
                    ? categoryV1Checklist
                    : legacyChecklist;
            Object.entries(savedStatuses).forEach(([oldKey, status]) => {
                const oldItem = previousChecklist[Number(oldKey)];
                if (oldItem) migratedStatuses[oldItem.id] = status;
            });
            Object.entries(savedComments).forEach(([oldKey, comment]) => {
                const oldItem = previousChecklist[Number(oldKey)];
                if (oldItem) migratedComments[oldItem.id] = comment;
            });
            savedStatuses = migratedStatuses;
            savedComments = migratedComments;
            localStorage.setItem('xpeng_checklist', JSON.stringify(savedStatuses));
            localStorage.setItem('xpeng_checklist_comments', JSON.stringify(savedComments));
            localStorage.setItem('xpeng_checklist_order', 'id-v1');
        }
        Object.keys(savedStatuses).forEach(id => {
            if (savedStatuses[id] === 'note') delete savedStatuses[id];
        });

        const els = {
            category: document.getElementById('item-category'),
            task: document.getElementById('item-task'),
            progressText: document.getElementById('progress-text'),
            headerActions: document.getElementById('header-actions'),
            idx: document.getElementById('current-idx'),
            total: document.getElementById('total-idx'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            btnOk: document.getElementById('btn-ok'),
            btnFail: document.getElementById('btn-fail'),
            commentInput: document.getElementById('comment-input'),
            screenChecklist: document.getElementById('checklist-screen'),
            screenList: document.getElementById('list-screen'),
            screenSummary: document.getElementById('summary-screen'),
            header: document.getElementById('checklist-header'),
            footer: document.getElementById('checklist-footer')
        };

        els.total.textContent = checklist.length;

        function loadItem(index) {
            const item = checklist[index];
            els.category.textContent = item.category;
            els.task.textContent = item.task;
            els.idx.textContent = index + 1;

            els.btnPrev.disabled = index === 0;
            els.btnNext.disabled = index === checklist.length - 1;

            // Reset buttons
            els.btnOk.className = 'btn';
            els.btnFail.className = 'btn';
            els.commentInput.value = savedComments[item.id] || '';

            // Apply saved status
            const status = savedStatuses[item.id];
            if (status === 'ok') els.btnOk.classList.add('active-ok');
            if (status === 'fail') els.btnFail.classList.add('active-fail');
        }

        function setStatus(status) {
            savedStatuses[checklist[currentIndex].id] = status;
            localStorage.setItem('xpeng_checklist', JSON.stringify(savedStatuses));
            loadItem(currentIndex);
            if (els.screenList.style.display === 'block') renderList();

            // Auto advance if not last item
            if (currentIndex < checklist.length - 1) {
                setTimeout(nextItem, 300);
            }
        }

        els.commentInput.addEventListener('input', () => {
            const comment = els.commentInput.value;
            const itemId = checklist[currentIndex].id;
            if (comment.trim()) savedComments[itemId] = comment;
            else delete savedComments[itemId];
            localStorage.setItem('xpeng_checklist_comments', JSON.stringify(savedComments));
            if (els.screenList.style.display === 'block') renderList();
        });

        function nextItem() {
            if (currentIndex < checklist.length - 1) {
                currentIndex++;
                loadItem(currentIndex);
            }
        }

        function prevItem() {
            if (currentIndex > 0) {
                currentIndex--;
                loadItem(currentIndex);
            }
        }

        function statusLabel(status) {
            if (status === 'ok') return ['תקין', 'status-ok'];
            if (status === 'note') return ['תוקן / הערה', 'status-note'];
            if (status === 'fail') return ['לא תקין', 'status-fail'];
            return ['לא נבדק', 'status-empty'];
        }

        function renderList() {
            els.screenList.innerHTML = '';
            const actions = document.createElement('div');
            actions.className = 'list-actions';
            const exportButton = document.createElement('button');
            exportButton.type = 'button';
            exportButton.className = 'export-btn';
            exportButton.textContent = 'הורדת CSV';
            exportButton.onclick = exportCsv;
            actions.appendChild(exportButton);
            els.screenList.appendChild(actions);

            checklist.forEach((item, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'list-item';
                button.setAttribute('aria-label', `פריט ${index + 1}: ${item.task}`);
                button.onclick = () => showItem(index);

                const number = document.createElement('span');
                number.className = 'list-number';
                number.textContent = index + 1;
                const content = document.createElement('span');
                content.className = 'list-content';
                const category = document.createElement('span');
                category.className = 'list-category';
                category.textContent = item.category;
                const task = document.createElement('span');
                task.className = 'list-task';
                task.textContent = item.task;
                content.append(category, task);
                const comment = (savedComments[item.id] || '').trim();
                if (comment) {
                    const commentPreview = document.createElement('div');
                    commentPreview.className = 'list-comment';
                    commentPreview.textContent = `הערה: ${comment.slice(0, 45)}${comment.length > 45 ? '…' : ''}`;
                    content.appendChild(commentPreview);
                }
                const status = document.createElement('span');
                const [label, className] = statusLabel(savedStatuses[item.id]);
                status.className = `list-status ${className}`;
                status.textContent = label;
                button.append(number, content, status);
                els.screenList.appendChild(button);
            });
        }

        function exportCsv() {
            const headers = ['מספר', 'קטגוריה', 'בדיקה', 'סטטוס', 'הערה'];
            const rows = checklist.map((item, index) => [
                index + 1,
                item.category,
                item.task,
                statusLabel(savedStatuses[item.id])[0],
                (savedComments[item.id] || '').trim()
            ]);
            const csv = [headers, ...rows]
                .map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(','))
                .join('\r\n');
            const blob = new Blob([`\uFEFF${csv}`], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'xpeng-checklist.csv';
            link.click();
            URL.revokeObjectURL(url);
        }

        function showList() {
            renderList();
            els.progressText.style.display = '';
            els.progressText.style.visibility = 'hidden';
            els.header.style.position = 'relative';
            els.headerActions.style.position = 'absolute';
            els.headerActions.style.left = '15px';
            els.screenChecklist.style.display = 'none';
            els.screenSummary.style.display = 'none';
            els.screenList.style.display = 'block';
            els.footer.style.display = 'none';
        }

        function showItem(index) {
            currentIndex = index;
            loadItem(currentIndex);
            els.progressText.style.display = '';
            els.progressText.style.visibility = 'visible';
            els.header.style.position = '';
            els.headerActions.style.position = '';
            els.headerActions.style.left = '';
            els.screenList.style.display = 'none';
            els.screenSummary.style.display = 'none';
            els.screenChecklist.style.display = 'flex';
            els.footer.style.display = 'flex';
        }

        function toggleSummary() {
            if (els.screenSummary.style.display === 'block') {
                els.screenSummary.style.display = 'none';
                els.screenChecklist.style.display = 'flex';
                els.screenList.style.display = 'none';
                els.footer.style.display = 'flex';
                els.progressText.style.display = '';
                els.progressText.style.visibility = 'visible';
                els.header.style.position = '';
                els.headerActions.style.position = '';
                els.headerActions.style.left = '';
            } else {
                els.screenChecklist.style.display = 'none';
                els.screenList.style.display = 'none';
                els.footer.style.display = 'none';
                els.screenSummary.style.display = 'block';

                let ok=0, fail=0, comments=0;
                for(let i=0; i<checklist.length; i++) {
                    const itemId = checklist[i].id;
                    if(savedStatuses[itemId] === 'ok') ok++;
                    if(savedStatuses[itemId] === 'fail') fail++;
                    if((savedComments[itemId] || '').trim()) comments++;
                }

                document.getElementById('sum-total').textContent = checklist.length;
                document.getElementById('sum-ok').textContent = ok;
                document.getElementById('sum-comments').textContent = comments;
                document.getElementById('sum-fail').textContent = fail;
                document.getElementById('sum-empty').textContent = checklist.length - (ok+fail);
            }
        }

        function resetProgress() {
            if(confirm('האם אתה בטוח שברצונך למחוק את כל ההתקדמות?')) {
                savedStatuses = {};
                savedComments = {};
                localStorage.removeItem('xpeng_checklist');
                localStorage.removeItem('xpeng_checklist_comments');
                currentIndex = 0;
                loadItem(0);
                if (els.screenList.style.display === 'block') renderList();
            }
        }

        // Init
        loadItem(0);
    </script>
