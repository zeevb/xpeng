<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלות ותשובות מקהילת XPENG</title>
    <style>
        :root {
            --navy: #173d63;
            --blue: #2d76ae;
            --sky: #eaf4fb;
            --ink: #173047;
            --muted: #607486;
            --line: #dce7ef;
            --surface: #fff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: #f5f9fb;
            font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        }
        .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; }
        header { padding: 22px 0; border-bottom: 1px solid var(--line); }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
        .brand { color: var(--navy); font-weight: 850; }
        .home-link { color: var(--blue); font-size: .92rem; font-weight: 750; text-decoration: none; }
        .home-link:hover, .home-link:focus-visible { text-decoration: underline; }
        main { padding: 36px 0 64px; }
        .eyebrow { color: var(--blue); font-size: .9rem; font-weight: 800; }
        h1 { margin: 7px 0 10px; color: var(--navy); font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.1; }
        .intro { max-width: 730px; margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
        .notice {
            margin: 0 0 24px;
            border: 1px solid #cfe4f1;
            border-radius: 14px;
            color: #35566c;
            background: var(--sky);
            line-height: 1.6;
        }
        .notice summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            font-weight: 750;
        }
        .notice summary::marker { content: ""; }
        .notice summary::-webkit-details-marker { display: none; }
        .notice summary span {
            flex-shrink: 0;
            color: var(--blue);
            font-size: .88rem;
            font-weight: 850;
        }
        .notice[open] summary { border-bottom: 1px solid #cfe4f1; }
        .notice p {
            margin: 0;
            padding: 13px 18px 16px;
        }
        .controls { display: grid; gap: 14px; margin-bottom: 28px; }
        .search-control, .category-filter { display: grid; gap: 8px; }
        label { color: var(--navy); font-weight: 800; }
        input, select {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid #b9cedb;
            border-radius: 12px;
            color: var(--ink);
            background: white;
            font: inherit;
            font-size: 1rem;
        }
        input:focus, select:focus, button:focus-visible {
            border-color: var(--blue);
            outline: 3px solid rgba(45,118,174,.18);
        }
        .control-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: end;
        }
        .clear-btn {
            min-height: 53px;
            padding: 0 18px;
            border: 1px solid var(--blue);
            border-radius: 12px;
            color: var(--blue);
            background: white;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
        }
        .clear-btn:hover { background: var(--sky); }
        .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        h2 { margin: 0; color: var(--navy); font-size: 1.25rem; }
        .count { color: var(--muted); font-size: .9rem; }
        .faq-list { display: grid; gap: 10px; }
        details {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 5px 16px rgba(23,61,99,.05);
        }
        summary { cursor: pointer; padding: 18px 20px; color: var(--navy); font-weight: 800; line-height: 1.5; }
        summary::marker { color: var(--blue); }
        .category-label { display: block; margin-bottom: 8px; color: var(--blue); font-size: .8rem; font-weight: 800; }
        .question-text { display: block; }
        .answer { padding: 0 20px 20px; color: #456073; line-height: 1.75; }
        .answer p { margin: 0 0 10px; }
        .answer p:last-child { margin-bottom: 0; }
        .answer ol, .answer ul { margin: 8px 0 14px; padding-right: 22px; }
        .empty-state {
            margin-top: 14px;
            padding: 20px;
            border: 1px dashed #b9cedb;
            border-radius: 14px;
            color: var(--muted);
            background: rgba(255,255,255,.65);
            text-align: center;
        }
        .meta { margin-top: 22px; }
        @media (max-width: 680px) {
            .shell { width: min(100% - 24px, 560px); }
            .topbar { align-items: flex-start; }
            main { padding-top: 28px; }
            .control-row { grid-template-columns: 1fr; }
            .clear-btn { width: 100%; }
            summary { padding: 16px; }
            .answer { padding: 0 16px 17px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div class="topbar">
                <div class="brand">שאלות ותשובות מקהילת XPENG</div>
                <a class="home-link" href="index.html">חזרה לכלים</a>
            </div>
        </header>
        <main>
            <p class="intro">תשובות שימושיות לשאלות שחזרו בקבוצת ה־WhatsApp של קהילת XPENG.</p>
            <details class="notice">
                <summary>חשוב: המידע מבוסס על ניסיון קהילתי ואינו מסמך רשמי. <span>קראו עוד</span></summary>
                <p id="disclaimer-text">המידע מבוסס על ניסיון קהילתי ואינו מסמך רשמי.</p>
            </details>
            <section class="controls" aria-label="סינון וחיפוש">
                <div class="control-row">
                    <div class="search-control">
                        <label for="faq-search">מה אתם מחפשים?</label>
                        <input id="faq-search" type="search" placeholder="לדוגמה: טעינה, NFC, Android Auto..." autocomplete="off">
                    </div>
                    <button class="clear-btn" id="clear-search" type="button" hidden>ניקוי</button>
                </div>
                <div class="category-filter">
                    <label for="category-select">סינון לפי נושא</label>
                    <select id="category-select">
                        <option value="">כל הנושאים</option>
                    </select>
                </div>
            </section>
            <div class="section-title">
                <h2>שאלות נפוצות</h2>
                <span class="count" id="result-count">טוען...</span>
            </div>
            <section class="faq-list" id="faq-list" aria-label="שאלות ותשובות"></section>
            <div class="empty-state" id="empty-state" hidden>לא נמצאו שאלות שמתאימות לחיפוש הזה.</div>
            <p class="count meta" id="faq-meta"></p>
        </main>
    </div>
    <script src="xpeng_faq_data.js"></script>
    <script src="xpeng_faq_app.js"></script>
    <!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "a8b0a1ea746e4dd2ac2a7f4e12555e82"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
